<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        /* Customer Mapping UI */

        #customer_map_tbody td {
            padding: 8px 10px;
            font-size: 13px;
            vertical-align: middle;
        }

        #customer_map_tbody tr:hover {
            background-color: #f8fafc;
        }

        #parent_cus_search,
        #child_cus_search {
            font-size: 12px;
            padding: 5px 8px;
        }

        #customer_map_tbody .btn {
            padding: 3px 8px;
            font-size: 12px;
        }

        .card {
            border-radius: 10px;
        }

        .card-header {
            border-bottom: 1px solid #edf0f2;
        }

        .form-control-sm {
            min-height: 34px;
        }

        @media (max-width: 767px) {
            .card-body {
                padding: 12px !important;
            }
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row g-3">

                <!-- Customer Mapping Form -->
                <div class="col-lg-3 col-md-4">
                    <div class="card border-0 shadow-sm h-100">

                        <div class="card-header bg-white py-2">
                            <h6 class="mb-0 fw-bold">
                                <i class="bi bi-diagram-3 me-2 text-primary"></i>
                                Customer Map
                            </h6>
                        </div>

                        <div class="card-body p-3">

                            <div class="mb-3">
                                <label for="customer_master" class="form-label small fw-semibold mb-1">
                                    Parent Customer
                                </label>
                                <input type="text" class="form-control form-control-sm rounded-2" id="customer_master"
                                    placeholder="Select parent customer">
                            </div>

                            <div class="mb-3">
                                <label for="child_customer" class="form-label small fw-semibold mb-1">
                                    Child Customer
                                </label>
                                <input type="text" class="form-control form-control-sm rounded-2" id="child_customer"
                                    placeholder="Select child customer">
                            </div>

                            <div class="d-flex gap-2 pt-1">

                                <button type="button" class="btn btn-primary btn-sm flex-fill" id="insert_button">
                                    <i class="bi bi-plus-lg me-1"></i> Submit
                                </button>

                                <button type="button" class="btn btn-primary btn-sm flex-fill d-none"
                                    id="update_button">
                                    <i class="bi bi-check-lg me-1"></i> Update
                                </button>

                                <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="clear_button">
                                    <i class="bi bi-x-lg"></i> Clear
                                </button>

                            </div>

                        </div>
                    </div>
                </div>


                <!-- Customer Mapping Table -->
                <div class="col-lg-9 col-md-8">

                    <div class="card border-0 shadow-sm h-100">

                        <div class="card-header bg-white py-2 d-flex align-items-center justify-content-between">
                            <h6 class="mb-0 fw-bold">
                                <i class="bi bi-list-ul me-2 text-primary"></i>
                                Customer Mapping List
                            </h6>

                            <span class="badge bg-light text-secondary border">
                                Customer Records
                            </span>
                        </div>

                        <div class="card-body p-0">

                            <div class="table-responsive">
                                <table class="table table-sm table-hover table-bordered align-middle mb-0">

                                    <thead class="table-light">
                                        <tr>
                                            <th class="py-2" style="min-width:180px;">
                                                <!-- <div class="small fw-bold mb-1">Parent Customer</div> -->
                                                <input type="text" class="form-control form-control-sm"
                                                    id="parent_cus_search" placeholder="Search parent customers...">
                                            </th>

                                            <th class="py-2" style="min-width:180px;">
                                                <!-- <div class="small fw-bold mb-1">Child Customer</div> -->
                                                <input type="text" class="form-control form-control-sm"
                                                    id="child_cus_search" placeholder="Search child customers...">
                                            </th>

                                            <th class="text-center py-2" style="width:100px;">
                                                <div class="small fw-bold">Action</div>
                                            </th>
                                        </tr>
                                    </thead>

                                    <tbody id="customer_map_tbody">
                                    </tbody>

                                </table>
                            </div>

                        </div>
                    </div>

                </div>

            </div>


        </div>




    </div>



    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/customer_map_master.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
