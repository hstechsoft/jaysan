<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style1.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .needs-validation {
            padding: 0.75rem !important;
        }

        .form-floating>.form-control {
            height: 2.2rem !important;
            padding: 0.25rem .5rem !important;
            font-size: .8rem;
        }

        .form-floating>label {
            padding: 0.25rem .5rem !important;
            font-size: .7rem;
        }

        /* Make input groups compact */
        .input-group-sm .form-control,
        .input-group-sm .input-group-text {
            padding: .15rem .3rem !important;
            font-size: .75rem !important;
        }

        /* Table compactness */
        .table th,
        .table td {
            padding: .35rem .5rem !important;
            font-size: .8rem;
        }

        .table caption {
            padding-bottom: .3rem !important;
        }

        /* Reduce overall card/form spacing */
        .p-4 {
            padding: 1rem !important;
        }

        /* Reduce spacing between floating fields */
        .mb-2 {
            margin-bottom: .4rem !important;
        }

        /* Compact button */
        #section_stock_btn {
            padding: .3rem .8rem !important;
            font-size: .8rem !important;
        }
    </style>

</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <div class="container-fluid " style="height: 100%; overflow-y: auto;">
        <!-- top bar -->



        <div class="d-flex align-items-center mx-5" id="page_start">
            <button id="fa-bars" class="btn btn-light">
                <i class="fa fa-bars fs-4" style="font-size: 15px !important"></i>
            </button>

            <h4 class="m-0">
                <span class="fw-bold">Jasyan App</span>
            </h4>
        </div>

        <section id="menu_bar" class="d-none"></section>





        <div class="page-wrapper">

            <!-- content -->

            <div class="row">

                <div class="col-md-2">
                    <form class="p-4 border rounded-4 shadow-sm bg-light needs-validation" id="" novalidate
                        onsubmit="return false">

                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="section" placeholder="">
                            <label for="section">Section</label>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="part" placeholder="">
                            <label for="part">Part </label>
                        </div>

                        <!-- <div class="d-flex">
                            <div class="form-floating mb-2">
                                <input type="number" class="form-control rounded-3" id="min_qty" placeholder="">
                                <label for="min_qty">Min Qty</label>
                            </div>
                            <div class="form-floating mb-2">
                                <input type="number" class="form-control rounded-3" id="max_qty" placeholder="">
                                <label for="max_qty">Max max_qty </label>
                            </div>
                        </div> -->

                        <div class="form-floating mb-2">
                            <input type="number" class="form-control rounded-3" id="qty" placeholder="">
                            <label for="qty">Qty</label>
                        </div>

                        <button type="submit" class="btn btn-primary " id="section_stock_btn">Submit</button>

                    </form>
                </div>

                <div class="col-md-10">
                    <div class="table-responsive">
                        <table class="table caption-top table-bordered table-striped ">
                            <thead>
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Part</th>
                                    <th scope="col">Qty</th>
                                    <th scope="col">Action</th>

                                </tr>
                            </thead>
                            <tbody id="section_stock_tbody">


                            </tbody>


                        </table>
                    </div>
                </div>

            </div>

        </div>

        <div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="requestModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="requestModalLabel">Material Request</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure do you need to request materials
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" id="req_btn">Request</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

        <!-- jQuery UI CSS -->

        <!-- bootstrap include -->
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
            integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
            integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
            crossorigin="anonymous"></script>

        <!-- font awesome -->
        <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

        <!-- Sweet alert -->
        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>


        <!-- external js -->
        <script src="js/json_section_stock.js" type="module"></script>
        <script src="js/menu.js" type="module"></script>
        <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
