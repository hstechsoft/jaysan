<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>

    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">

                <div class="col-md-3">
                    <form class="p-4 border rounded-4 shadow-sm bg-light needs-validation" id="nesting_entry_form"
                        novalidate onsubmit="return false">


                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="nesting_name" placeholder="" required>
                            <label for="nesting_name">Nesting Name
                                <span class="text-danger">*</span> </label>

                            <div class="invalid-feedback">
                                Kindly Enter Vaild Data
                            </div>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="material_id" placeholder="" required>
                            <label for="material_id">Material
                                <span class="text-danger">*</span> </label>

                            <div class="invalid-feedback">
                                Kindly Enter Vaild Data
                            </div>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="number" class="form-control rounded-3" id="material_qty" placeholder=""
                                required>
                            <label for="material_qty">Material Qty
                                <span class="text-danger">*</span> </label>

                            <div class="invalid-feedback">
                                Kindly Enter Vaild Data
                            </div>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="number" class="form-control rounded-3" id="run_time" placeholder="" required>
                            <label for="run_time">Time
                                <span class="text-danger">* In Mins</span> </label>

                            <div class="invalid-feedback">
                                Kindly Enter Vaild Data
                            </div>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="text" class="form-control rounded-3" id="product" placeholder="" required>
                            <label for="product">Product
                                <span class="text-danger">*</span> </label>

                            <div class="invalid-feedback">
                                Kindly Enter Vaild Data
                            </div>
                        </div>

                        <div class="form-floating mb-2">
                            <input type="file" class="form-control rounded-3" id="nest_file" placeholder="" required>
                            <label for="nest_file">
                                <span class="text-danger">* Only PDF's Allowed</span> </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <div class="form-floating mb-2">
                                <input type="text" class="form-control rounded-3" id="nested_parts" placeholder="">
                                <label for="nested_parts">Nested Part</label>
                            </div>
                            <div class="form-floating mb-2">
                                <input type="text" class="form-control rounded-3" id="nested_part_qty" placeholder="">
                                <label for="nested_part_qty">Nested Part Qty</label>
                            </div>
                            <div class="align-middle text-center">
                                <button type="button" class="btn btn-primary " id="nested_part_add_btn">+</button>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table caption-top table-bordered table-striped ">
                                <caption></caption>
                                <thead class="small">

                                    <tr>
                                        <th scope="col">Part name</th>
                                        <th scope="col">Qty</th>
                                        <th scope="col">Action</th>

                                    </tr>
                                </thead>
                                <tbody  class="small" id="nesting_parts_tbody">


                                </tbody>


                            </table>
                        </div>


                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary " id="add_nesting_btn">Add</button>
                            <button type="submit" class="btn btn-secondary d-none"
                                id="update_nesting_btn">Update</button>
                            <button type="submit" class="btn btn-warning " id="clear_btn">Clear</button>
                        </div>

                    </form>
                </div>

                <div class="col-md-9">

                    <div class="table-responsive">
                        <table class="table caption-top table-bordered table-striped ">
                            <caption></caption>
                            <thead>

                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Nesting Name</th>
                                    <th scope="col">Material</th>
                                    <th scope="col">Material Qty</th>
                                    <th scope="col">Process Time</th>
                                    <th scope="col">Product</th>
                                    <th scope="col">Employee</th>
                                    <th scope="col">Nested Parts</th>
                                    <th scope="col">Action</th>

                                </tr>
                            </thead>
                            <tbody id="nesting_details_tbody">




                            </tbody>


                        </table>
                    </div>

                </div>

            </div>

        </div>




    </div>




    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/laser_entry.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
