<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>

    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->




        <div class="page-wrapper mt-5 mt-md-0">

            <div class="row">

                <div class="col-md-3">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title">Quotation Details</h5>
                        </div>
                        <div class="card-body">
                            <label for="employee" class="form-label">Employee</label>
                            <input type="text" class="form-control" placeholder="Employee" id="employee">

                            <label for="quotation_number" class="form-label">Quotation Number</label>
                            <input type="text" class="form-control" placeholder="Quotation Number"
                                id="quotation_number">

                            <div class="d-flex justify-content-between">
                                <div class="mb-3">
                                    <label for="parts" class="form-label">Parts</label>
                                    <input type="text" class="form-control" placeholder="Parts" id="parts">
                                </div>
                                <div class="mb-3">
                                    <button type="button" class="btn btn-secondary mt-2" id="add_parts_btn">Add
                                        Part</button>
                                </div>
                            </div>

                            <label for="tally_qu_no" class="form-label">Tally Quotation Number</label>
                            <input type="text" class="form-control" placeholder="Tally Quotation Number"
                                id="tally_qu_no">

                            <label for="quotation_date" class="form-label">Quotation Date</label>
                            <input type="date" class="form-control" id="quotation_date">

                            <label for="customer_name" class="form-label">Customer Name</label>
                            <input type="text" class="form-control" placeholder="Customer Name" id="customer_name">

                            <label for="customer_contact" class="form-label">Customer Contact</label>
                            <input type="text" class="form-control" placeholder="Customer Contact"
                                id="customer_contact">

                            <label for="customer_address" class="form-label">Customer Address</label>
                            <input type="text" class="form-control" placeholder="Customer Address"
                                id="customer_address">

                            <label for="same_as">Ship To Address is Same as Customer Address?</label>
                            <input type="checkbox" class="form-check-input" id="same_as">
                            <label class="form-check-label" for="same_as">Yes</label>

                            <label for="ship_to_cus_name" class="form-label">Name of Recipient at Ship To
                                Address</label>
                            <input type="text" class="form-control" placeholder="Name of Recipient"
                                id="ship_to_cus_name">

                            <label for="ship_to_cus_contact" class="form-label">Contact of Recipient at Ship To
                                Address</label>
                            <input type="text" class="form-control" placeholder="Contact of Recipient"
                                id="ship_to_cus_contact">

                            <label for="ship_to_address" class="form-label">Ship To Address</label>
                            <input type="text" class="form-control" placeholder="Ship To Address" id="ship_to_address">

                            <label for="qu_validity" class="form-label">Quotation Validity</label>
                            <input type="date" class="form-control" id="qu_validity">
                        </div>

                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary">Save Quotation</button>
                        </div>

                    </div>
                </div>

                <div class="col-md-9">
                    <div class="card">
                        <div class="card-header">
                            <h5>Parts List</h5>
                        </div>
                        <div class="card-body" id="parts_list">
                            <div class="table-responsive">
                                <table class="table caption-top table-bordered table-striped small">
                                    <caption></caption>
                                    <thead>

                                        <tr>
                                            <th scope="col">#</th>
                                            <th scope="col">Part Name</th>
                                            <th scope="col">Qty</th>
                                            <th scope="col">UOM</th>
                                            <th scope="col">GST</th>
                                            <th scope="col">Price/Unit</th>
                                            <th scope="col">Total</th>
                                            <th scope="col">Discount %</th>
                                            <th scope="col">Net Total</th>
                                            <th scope="col">Actions</th>

                                        </tr>
                                    </thead>
                                    <tbody id="parts_list_tbody">
                                        <tr>

                                            <td>1</td>
                                            <td>Sample Part</td>
                                            <td>
                                                <input type="number" class="form-control form-control-sm form_qty"
                                                    placeholder="Qty">
                                            </td>
                                            <td>
                                                 <select class="form-select form-select-sm form_uom">
                                                    <option value="Nos" selected>Nos</option>
                                                    <option value="No">No</option>
                                                    <option value="NUM">NUM</option>
                                                    <option value="Pcs">Pcs</option>
                                                    <option value="Sets">Sets</option>
                                                    <option value="Sheet">Sheet</option>
                                                    <option value="kgs">kgs</option>
                                                    <option value="Ltr">Ltr</option>
                                                    <option value="mls">mls</option>
                                                    <option value="Mts">Mts</option>
                                                    <option value="mtrs">mtrs</option>
                                                    <option value="mm">mm</option>
                                                    <option value="CUM">CUM</option>
                                                </select>
                                            </td>
                                            <td>
                                                <select class="form-select form-select-sm form_gst">
                                                    <option selected value="0%">0%</option>
                                                    <option value="5">5%</option>
                                                    <option value="18">18%</option>
                                                    <option value="40">40%</option>
                                                </select>
                                            </td>
                                            <td>
                                                <input type="number" class="form-control form-control-sm form_price"
                                                    placeholder="Price">
                                            </td>
                                            <td>200</td>
                                            <td>
                                                <input type="number" class="form-control form-control-sm form_discount"
                                                    placeholder="Discount %">
                                            </td>
                                            <td>200</td>
                                            <td>
                                                <button class="btn btn-sm btn-danger delete_btn"><i
                                                        class="fas fa-trash-alt"></i></button>
                                            </td>

                                        </tr>


                                    </tbody>


                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>





    </div>



    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->

    <script src="js/menu.js" type="module"></script>
    <script src="js/quotations.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
