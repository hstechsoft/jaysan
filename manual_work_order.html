<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- bootsttrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <title>Document</title>

    <!-- external css -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <link rel="stylesheet" href="//code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">


    <style>
        .work-order-card {
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .work-order-card .card-header {
            border-color: #edf0ed !important;
        }

        .wo-header-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf5ed;
            color: #198754;
            font-size: 15px;
        }

        .wo-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #424b45;
            margin-bottom: 5px;
        }

        .wo-label span {
            color: #dc3545;
        }

        .wo-input {
            min-height: 34px;
            border: 1px solid #e1e6e2;
            border-radius: 6px;
            font-size: 12px;
            color: #343a40;
            background-color: #fff;
            transition: all 0.2s ease;
        }

        .wo-input::placeholder {
            color: #a3aaa5;
            font-size: 11px;
        }

        .wo-input:focus {
            border-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.09);
        }

        textarea.wo-input {
            min-height: 58px;
            resize: vertical;
        }

        .work-order-card .btn {
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            min-height: 32px;
        }

        .work-order-card .btn-success {
            background: #198754;
            border-color: #198754;
        }

        .work-order-card .btn-success:hover {
            background: #146c43;
            border-color: #146c43;
        }

        .work-order-card .btn-light {
            border: 1px solid #e1e6e2;
            color: #59615b;
        }
    </style>



</head>

<body>
    <section>

    </section>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="myToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header ">
                <strong class="me-auto toast-title">Toast Title</strong>
                <small class="text-muted">Just now</small>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body toast-description">
                Hello, this is a Bootstrap toast message!
            </div>
        </div>
    </div>
    <section id="menu_bar"></section>
    <div class="container-fluid mb-2">
        <!-- top bar -->


        <div class=" page-wrapper mt-5 mt-md-0">

            <div class="row">


                <div class="col-md-4">
                    <div class="card work-order-card border-0 shadow-sm">

                        <div class="card-header bg-white border-bottom px-3 py-3">
                            <div class="d-flex align-items-center gap-2">
                                <div class="wo-header-icon">
                                    <i class="fas fa-clipboard-list"></i>
                                </div>
                                <div>
                                    <h6 class="mb-0 fw-semibold">Work Order Details</h6>
                                    <small class="text-muted">Enter work order information</small>
                                </div>
                            </div>
                        </div>

                        <div class="card-body p-3">
                            <form id="work_order_form">

                                <div class="row g-3">

                                    <div class="col-12">
                                        <label for="to_godown" class="wo-label">
                                            To Godown <span>*</span>
                                        </label>
                                        <input type="text" class="form-control form-control-sm wo-input" id="to_godown"
                                            placeholder="Select Godown" required>
                                    </div>

                                    <div class="col-6">
                                        <label for="to_department" class="wo-label">To Department</label>
                                        <input type="text" class="form-control form-control-sm wo-input"
                                            id="to_department" placeholder="Select Department">
                                    </div>

                                    <div class="col-6">
                                        <label for="to_section" class="wo-label">To Section</label>
                                        <input type="text" class="form-control form-control-sm wo-input" id="to_section"
                                            placeholder="Select Section">
                                    </div>

                                    <div class="col-12">
                                        <label for="part" class="wo-label">
                                            Part <span>*</span>
                                        </label>
                                        <input type="text" class="form-control form-control-sm wo-input" id="part"
                                            placeholder="Select Part" required>
                                    </div>

                                    <div class="col-6">
                                        <label for="quantity" class="wo-label">
                                            Quantity <span>*</span>
                                        </label>
                                        <input type="number" min="1" class="form-control form-control-sm wo-input"
                                            id="quantity" placeholder="Enter quantity" required>
                                    </div>

                                    <div class="col-6">
                                        <label for="due_date" class="wo-label">
                                            Due Date <span>*</span>
                                        </label>
                                        <input type="date" class="form-control form-control-sm wo-input" id="due_date"
                                            required>
                                    </div>

                                    <div class="col-12">
                                        <label for="plan_name" class="wo-label">
                                            Work Order Name <span>*</span>
                                        </label>
                                        <input type="text" class="form-control form-control-sm wo-input" id="plan_name"
                                            placeholder="Enter work order name" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="remarks" class="wo-label">Remarks</label>
                                        <textarea class="form-control form-control-sm wo-input" id="remarks" rows="2"
                                            placeholder="Add additional notes (optional)"></textarea>
                                    </div>

                                </div>

                                <div class="d-flex justify-content-end align-items-center gap-2 mt-4 pt-3 border-top">
                                    <button type="reset" class="btn btn-light btn-sm px-3">
                                        Reset
                                    </button>
                                    <button type="submit" class="btn btn-success btn-sm px-4" id="submit_button">
                                        <i class="fas fa-check me-1"></i> Submit
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>


                <div class="col-md-8"></div>

            </div>

        </div>




    </div>





    <div id='footer' class="mt-auto"></div>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.1/jquery-ui.min.js"></script>

    <!-- SWAL FIRE -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- jQuery UI CSS -->

    <!-- bootstrap include -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
        integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
        integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
        crossorigin="anonymous"></script>

    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/86b62f3d3e.js" crossorigin="anonymous"></script>

    <!-- Sweet alert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- external js -->
    <script src="js/manual_work_order.js" type="module"></script>
    <script src="js/menu.js" type="module"></script>
    <!-- <script src="js/get_all_id.js" type="module"></script> -->

</body>

</html>
